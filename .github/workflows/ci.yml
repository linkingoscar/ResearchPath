name: ResearchPath quality gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out audited source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Restore local R runtime and library
        id: r_runtime_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .runtime/R
            .runtime/R-library
            .runtime/renv-bootstrap-library
          key: windows-r-4.6.1-abi3-${{ hashFiles('renv.lock') }}
          restore-keys: |
            windows-r-4.6.1-abi2-${{ hashFiles('renv.lock') }}
            windows-r-4.6.1-${{ hashFiles('renv.lock') }}
            windows-r-4.6.1-

      - name: Restore Rtools toolchain
        id: rtools_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: C:\rtools45
          key: windows-rtools45-${{ hashFiles('.github/rtools45-cache-key.txt') }}

      - name: Install strictly locked dependencies
        shell: pwsh
        run: ./scripts/setup.ps1

      # Save cold-start artifacts before the quality gate. A later test failure
      # must not discard a successful 25+ minute R/Rtools bootstrap and force
      # the next diagnostic run to repeat it from scratch.
      - name: Save local R runtime and library
        if: steps.r_runtime_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .runtime/R
            .runtime/R-library
            .runtime/renv-bootstrap-library
          key: ${{ steps.r_runtime_cache.outputs.cache-primary-key }}

      - name: Save Rtools toolchain
        if: steps.rtools_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: C:\rtools45
          key: ${{ steps.rtools_cache.outputs.cache-primary-key }}

      # The upstream data host currently presents a certificate-name mismatch
      # to GitHub's Windows runner. Keep the network-dependent oracle lane
      # explicit and manual; push/PR quality must reach the repository tests
      # instead of failing before them because of a third-party TLS outage.
      # The fetch remains SHA-256 pinned and fails loudly when manually run.
      - name: Fetch public validation data pack (SHA-256 pinned)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/fetch-public-validation-data.ps1

      - name: Run architecture, contracts, types, statistics and builds
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Audit Python and Node dependencies
        shell: pwsh
        run: ./scripts/audit-dependencies.ps1

      - name: Generate machine-readable build evidence
        if: success()
        shell: pwsh
        run: >-
          ./.venv/Scripts/python.exe scripts/release-evidence.py
          --test-status passed --mode Full --run-id "${{ github.run_id }}"
          --required-step quality-gate --required-step dependency-audit
          --completed-step quality-gate --completed-step dependency-audit
          --output output/release/ci-evidence.json

      - name: Upload quality evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: researchpath-quality-evidence-${{ github.run_id }}
          path: |
            output/release/ci-evidence.json
            output/performance/r-runtime-baseline.json
            specs/openapi.json
          if-no-files-found: error
          retention-days: 30
