name: ResearchPath checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      RESEARCHPATH_CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'missing-ci-base' }}

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Resolve test impact
        id: impact
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $impactJson = & python scripts/resolve-test-impact.py --root . --base-ref $env:RESEARCHPATH_CI_BASE_REF --diff-mode direct
          if ($LASTEXITCODE -ne 0) { throw 'Test impact resolution failed.' }
          $impact = $impactJson | ConvertFrom-Json
          Write-Host ($impact | ConvertTo-Json -Depth 5)
          "runtime-required=$($impact.requiresRuntime.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "mode=$($impact.mode)" >> $env:GITHUB_OUTPUT

      - name: Prepare lightweight dependencies
        if: github.event_name != 'workflow_dispatch' && steps.impact.outputs.runtime-required == 'false'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed.' }
          ./.venv/Scripts/python.exe -m pip install --require-hashes -r apps/api/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Node dependency installation failed.' }

      - name: Restore R runtime and library
        if: github.event_name == 'workflow_dispatch' || steps.impact.outputs.runtime-required == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .runtime/R
            .runtime/R-library
            .runtime/renv-bootstrap-library
          key: windows-r-4.6.1-${{ hashFiles('renv.lock') }}

      - name: Restore Rtools toolchain
        if: github.event_name == 'workflow_dispatch' || steps.impact.outputs.runtime-required == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: C:\rtools45
          key: windows-rtools45-${{ hashFiles('.github/rtools45-cache-key.txt') }}

      - name: Prepare runtime dependencies
        if: github.event_name == 'workflow_dispatch' || steps.impact.outputs.runtime-required == 'true'
        shell: pwsh
        run: ./scripts/setup.ps1

      - name: Run selected checks
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          RESEARCHPATH_CI_MODE: ${{ steps.impact.outputs.mode }}
        run: ./scripts/harness.ps1 -Mode $env:RESEARCHPATH_CI_MODE -BaseRef $env:RESEARCHPATH_CI_BASE_REF -DiffMode direct

      - name: Run Full checks
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/harness.ps1 -Mode Full

      - name: Audit dependencies
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/audit-dependencies.ps1
