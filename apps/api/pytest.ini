[pytest]
pythonpath = .
testpaths = tests
addopts = -q --basetemp=.pytest-tmp
strict_markers = true
markers =
    unit: Pure functions, formulas, and transformations
    contract: Schema, Pydantic, OpenAPI, TypeScript, and result bundle contracts
    service: Python service layer tests without full HTTP
    api: FastAPI routing and persistence integration
    r_numeric: R statistical numerical precision tests
    golden: Frozen golden standard verification cases
    task: Lifecycle, cancellation, timeout, recovery, and resource budget tests
    export: Tables, plots, and replication package export
    migration: Database schema upgrade paths
    e2e: End-to-end browser user flows
    slow: High execution time tests
    serial: Non-parallelizable tests requiring exclusive resource lock
